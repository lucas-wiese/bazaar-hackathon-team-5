[project]
name = "bazaar-hackathon-team-5"
version = "0.1.0"
description = "Team 5 at The Bazaar (Causa Prima's Claude Code hackathon, Madrid 2026): a multi-agent control room for a live AI-agent card market"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
